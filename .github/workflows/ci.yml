name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first: a queue of superseded
# runs on a Windows runner is slow and tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # OpenGrep is not committed — it is ~52 MB. The suite is expected to pass
      # without it: the dataflow tier reports itself unavailable and the scan
      # says so, which is the behaviour a missing engine must produce.
      - name: Run tests
        run: python -m pytest backend/tests -q --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # A build that produces nothing still exits zero, so the output is checked
      # rather than assumed.
      - name: Verify bundle
        working-directory: frontend
        shell: bash
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/assets    || { echo "dist/assets missing"; exit 1; }
          echo "bundle size: $(du -sh dist | cut -f1)"

  lint:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install checkers
        run: pip install ruff

      # Errors only. A style opinion failing a build on somebody else's pull
      # request wastes their time; a syntax error or an undefined name does not.
      - name: Ruff
        run: ruff check backend --select E9,F63,F7,F82 --output-format github

      - name: Compile every module
        run: python -m compileall -q backend launcher.py installer_wizard.py build.py
