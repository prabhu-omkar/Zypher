name: Release

# Tagging is the trigger, so a release is always cut from a commit that exists
# rather than from whatever happened to be checked out on somebody's laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A release that ships failing code is worse than a late release.
      - name: Run tests
        run: python -m pytest backend/tests -q

      # Tier 4 needs a binary that is not in the repository. Without it the
      # shipped installer would carry a permanently unavailable tier, so the
      # release fetches it rather than silently building without.
      - name: Fetch the dataflow engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force vendor/opengrep | Out-Null
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/opengrep/opengrep/releases/latest' `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
          $asset = $release.assets |
            Where-Object { $_.name -like '*windows*x86*' -and $_.name -like '*.exe' } |
            Select-Object -First 1
          if ($null -eq $asset) {
            Write-Warning 'No Windows OpenGrep asset found; building without Tier 4.'
            exit 0
          }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile vendor/opengrep/opengrep.exe
          Write-Host "opengrep.exe: $((Get-Item vendor/opengrep/opengrep.exe).Length) bytes"

      - name: Build application and installer
        run: python build.py

      - name: Record what was built
        id: meta
        shell: pwsh
        run: |
          $setup = Get-Item dist/Zypher_Setup.exe
          $hash = (Get-FileHash dist/Zypher_Setup.exe -Algorithm SHA256).Hash
          $mb = [math]::Round($setup.Length / 1MB, 1)
          "sha256=$hash"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size_mb=$mb"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Zypher_Setup.exe  $mb MB  SHA256 $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zypher_Setup
          path: dist/Zypher_Setup.exe
          retention-days: 30

      # The checksum goes in the release body rather than only in the log, so
      # anyone downloading the installer can verify it without re-running CI.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Zypher_Setup.exe
          generate_release_notes: true
          body: |
            ## Zypher ${{ github.ref_name }}

            Offline cryptographic discovery and post-quantum migration
            intelligence. Windows 10/11, per-user install, no administrator
            rights required.

            ### Download

            `Zypher_Setup.exe` — ${{ steps.meta.outputs.size_mb }} MB

            ```
            SHA256  ${{ steps.meta.outputs.sha256 }}
            ```

            Verify before running:

            ```powershell
            Get-FileHash Zypher_Setup.exe -Algorithm SHA256
            ```

            ### Requirements

            - Windows 10 or 11 (x64)
            - Edge WebView2 Runtime — preinstalled on Windows 11

            See the [README](https://github.com/prabhu-omkar/Zypher#readme) for
            what it does and how the risk model works.
