[pytest]
# Anchor the rootdir here so every relative path in the test suite resolves
# against the repository root, not the nearest conftest.py.
#
# Without this, pytest walks up from backend/tests/ and sets rootdir there,
# which means paths like "test/source_repo/PaymentVault.java" in test files
# are resolved as "backend/tests/test/source_repo/..." and silently fail.
testpaths = backend/tests
addopts   = -q
